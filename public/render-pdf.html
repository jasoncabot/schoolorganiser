<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>PDF renderer</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      Opened by Browser Run's screenshot Quick Action (src/extract/render.ts), never by people:
      /render-pdf?src=<same-origin PDF URL>&page=<n>
      Draws one page with our self-hosted pdf.js, then adds #rendered so the screenshot can be
      taken of the canvas. Adds #failed instead if the PDF or page can't be drawn.
    -->
    <script type="module">
      import * as pdfjs from "/assets/pdfjs/pdf.min.mjs";
      pdfjs.GlobalWorkerOptions.workerSrc = "/assets/pdfjs/pdf.worker.min.mjs";

      const SCALE = 1.5;
      const params = new URLSearchParams(location.search);
      const mark = (id) => {
        const marker = document.createElement("div");
        marker.id = id;
        document.body.append(marker);
      };

      try {
        const src = params.get("src") ?? "";
        const pageNumber = Number(params.get("page") ?? "1");
        // Only fetch from our own origin.
        if (new URL(src, location.href).origin !== location.origin) throw new Error("bad src");
        const base = "/assets/pdfjs/";
        const pdf = await pdfjs.getDocument({
          url: src,
          isEvalSupported: false,
          standardFontDataUrl: `${base}standard_fonts/`,
          cMapUrl: `${base}cmaps/`,
          cMapPacked: true,
          wasmUrl: `${base}wasm/`,
          iccUrl: `${base}iccs/`,
        }).promise;
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: SCALE });
        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        const context = canvas.getContext("2d");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: context, viewport }).promise;
        document.body.prepend(canvas);
        mark("rendered");
      } catch (error) {
        console.error(error);
        mark("failed");
      }
    </script>
  </body>
</html>
